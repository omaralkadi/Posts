

<div class="relative">
    <!-- الصفحة -->
    <div class="w-full lg:w-[100%] mx-auto mt-8 lg:mt-5 mt-20 p-4 lg:p-20 grid lg:grid-cols-12 gap-4 bg-gray-50">

        

    <!-- LEFT SIDEBAR -->
        <div class="lg:col-start-1  lg:col-end-3">
            <aside>
                <div class="bg-white rounded-2xl shadow-sm p-4 space-y-2">
                    <button routerLink="" routerLinkActive="bg-blue-50 text-blue-600 font-medium"
                        class="w-full cursor-pointer flex items-center gap-3 px-3 py-2 text-gray-600 hover:bg-gray-50 rounded-xl">
                        <i class="fa-solid fa-house"></i>
                        Feed
                    </button>
                    <button routerLink="" routerLinkActive="bg-blue-50 text-blue-600 font-medium"
                        class="w-full cursor-pointer flex items-center gap-3 px-3 py-2 ">
                        <i class="fa-solid fa-hashtag"></i>
                        My Posts
                    </button>
                    <button routerLink="" routerLinkActive="bg-blue-50 text-blue-600 font-medium"
                        class="w-full cursor-pointer flex items-center gap-3 px-3 py-2 text-gray-600 hover:bg-gray-50 rounded-xl">
                        <i class="fa-solid fa-users"></i>
                        Community
                    </button>
                    <button routerLink="" routerLinkActive="bg-blue-50 text-blue-600 font-medium"
                        class="w-full cursor-pointer flex items-center gap-3 px-3 py-2 text-gray-600 hover:bg-gray-50 rounded-xl">
                        <i class="fa-regular fa-bookmark"></i>
                        Saved
                    </button>
                </div>
            </aside>
        </div>

        

        <div class="lg:col-start-3 lg:col-end-10">
            
           <app-create-post></app-create-post>
           
            @for (post of allPosts; track post._id) {
               <app-post [post]="post"></app-post>
            }

        </div>

        <!-- RIGHT SIDEBAR -->
    <div class="lg:col-start-10 lg:col-end-13 ">
        <app-followers></app-followers>
    </div>

    </div>
</div>
