<nav class="bg-neutral-primary fixed w-full z-20 top-0 start-0 border-b border-default">
  <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
    <a routerLink="/main/feed" class="flex items-center space-x-3 rtl:space-x-reverse">
        <img src="https://flowbite.com/docs/images/logo.svg" class="h-7" alt="Flowbite Logo">
        <span class="self-center text-xl text-heading font-semibold whitespace-nowrap">Posts</span>
    </a>

  <div class="flex md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
<!-- Avatar -->
      <button
        id="dropdownUserAvatarButton"
        data-dropdown-toggle="dropdownAvatar"
        class="flex text-sm bg-gray-800 rounded-full md:me-0 focus:ring-4 focus:ring-gray-300"
        type="button"
      >
        <img
          class="w-10 h-10 rounded-full cursor-pointer"
          [src]="UserData?.photo|| 'https://flowbite.com/docs/images/people/profile-picture-5.jpg'"
          alt="user photo"
        />
      </button>

      <!-- Dropdown menu -->
      <div
        id="dropdownAvatar"
        class="z-50 hidden bg-white divide-y divide-gray-100 rounded-lg shadow w-56"
      >
        <div class="px-4 py-3 text-sm text-gray-900">
          <div>{{ UserData?.name || 'John Doe' }}</div>
          <div class="font-medium truncate">{{ UserData?.email || 'name@flowbite.com' }}</div>
        </div>

        <ul class="py-2 text-sm text-gray-700">
          <li>
            <a href="#" class="block px-4 py-2 hover:bg-gray-100">Settings</a>
          </li>
        </ul>

        <div class="py-2 cursor-pointer">
          <a (click)="SignOut()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
            Sign out
          </a>
        </div>
      </div>
  </div>

    <div class="flex justify-center">
            <div class="flex items-center gap-2 bg-gray-100 p-2 rounded-2xl shadow-sm">

                <!-- Feed (Active) -->
                <button routerLinkActive="text-blue-600 bg-white rounded-xl shadow-sm font-medium"  routerLink="/main/feed"
                    class="flex items-center gap-2 px-3 py-2 hover:bg-white hover:shadow-sm bg-white hover:rounded-xl cursor-pointer  rounded-xl shadow-sm font-medium">
                    <i class="fa-solid fa-house"></i>
                    <span class="text-sm">Feed</span>
                </button>

                <!-- Profile -->
                <button routerLinkActive="text-blue-600 bg-white rounded-xl shadow-sm font-medium" routerLink="/main/profile"
                    class="flex items-center gap-2 px-3 py-2  text-gray-600 hover:bg-white hover:shadow-sm hover:rounded-xl cursor-pointer rounded-xl font-medium transition">
                    <i class="fa-regular fa-user"></i>
                    <span class="text-sm">Profile</span>
                </button>

                <!-- Notifications -->
                <button routerLinkActive="text-blue-600 bg-white rounded-xl shadow-sm font-medium"
                    routerLink="/main/notifications"
                    class="relative flex items-center gap-2 px-3 py-2 text-gray-600 hover:bg-white hover:shadow-sm hover:rounded-xl cursor-pointer  rounded-xl font-medium transition">
                    <i class="fa-regular fa-bell"></i>
                    <span class="text-sm">Notifications</span>

                    <!-- Badge -->
                    <span
                        class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-semibold w-5 h-5 flex items-center justify-center rounded-full">
                        11
                    </span>
                </button>

            </div>
        </div>
