<!-- Create Post Button -->
<div class="w-full bg-white p-4 rounded-2xl shadow-sm border">
  <div class="flex items-center gap-3">

    <!-- Avatar -->
    <img 
      [src]="UserData?.photo || 'https://flowbite.com/docs/images/people/profile-picture-5.jpg'"
      class="w-10 h-10 rounded-full object-cover"
    >

    <!-- Input Trigger -->
    <button
      data-modal-target="postModal" 
      data-modal-toggle="postModal"
      class="flex-1 bg-gray-100 hover:bg-gray-200 transition px-4 py-2 rounded-full text-left text-gray-500">
      What are you thinking...
    </button>

  </div>
</div>


<!-- Modal -->
<div id="postModal" tabindex="-1"
  class="hidden fixed inset-0 z-50 flex justify-center items-center bg-black/50 backdrop-blur-sm">

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-0 overflow-hidden">

    <!-- Header -->
    <div class="flex justify-between items-center px-5 py-4 border-b">
      <h3 class="text-lg font-semibold">Create Post</h3>
      <button data-modal-hide="postModal"
        class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-500">
        ✕
      </button>
    </div>

    <!-- User Info -->
    <div class="flex items-center gap-3 px-5 py-3">
      <img 
        [src]="UserData?.photo || 'https://flowbite.com/docs/images/people/profile-picture-5.jpg'"
        class="w-10 h-10 rounded-full object-cover"
      >
      <div>
        <div class="font-semibold text-sm">{{ UserData?.name || 'John Doe' }}</div>
        <div class="text-xs text-gray-500">Public</div>
      </div>
    </div>

    <!-- Body -->
    <div class="px-5 pb-3">

      <textarea
        [(ngModel)]="postContent"
        class="w-full resize-none text-lg placeholder-gray-400 focus:outline-none"
        rows="4"
        placeholder="What are you thinking...">
      </textarea>

      <!-- Preview -->
      @if (imagePreview) {
        <div class="mt-3 relative">
          <img [src]="imagePreview" class="rounded-xl max-h-72 w-full object-cover">
        </div>
      }

    </div>

    <!-- Actions -->
    <div class="px-5 py-3 border-t flex items-center justify-between">

      <!-- Upload -->
      <label class="flex items-center gap-2 text-gray-600 cursor-pointer hover:text-blue-600">
        <i class="fa-regular fa-image"></i>
        <span class="text-sm">Photo</span>
        <input type="file" (change)="onFileSelected($event)" hidden>
      </label>

      <!-- Submit -->
      <button 
        (click)="submitPost()"
        [disabled]="isLoading || (!postContent && !selectedFile)"
        class="bg-blue-600 hover:bg-blue-700 transition text-white px-5 py-2 rounded-full font-medium disabled:opacity-50 disabled:cursor-not-allowed">

        @if (isLoading) {
          Posting...
        } @else {
          Post
        }

      </button>

    </div>

  </div>
</div>
