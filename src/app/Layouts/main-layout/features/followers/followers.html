<aside>
  <div class="bg-white rounded-2xl shadow-sm p-4 space-y-4">

    <h3 class="font-semibold text-sm">
      Suggested Friends
    </h3>

    <input
      type="text"
      placeholder="Search friends..."
      class="w-full bg-gray-100 rounded-lg px-3 py-2 text-sm focus:outline-none"
      [(ngModel)]="searchWord"
    />

    <div class="space-y-3">

      @for (follower of followersList | followersFilter:searchWord; track follower._id) {

        <div class="flex items-center justify-between">

          <div class="flex items-center gap-3">

            <div class="w-9 h-9 bg-gray-300 rounded-full">
              <img
                [src]="follower.photo"
                [alt]="follower.name"
                class="w-full h-full object-cover rounded-full"
              />
            </div>

            <div>
              <p class="text-sm font-medium">
                {{ follower.name }}
              </p>

              <p class="text-xs text-gray-500">
                {{ follower.mutualFollowersCount }} mutual friends
              </p>
            </div>

          </div>
            <button
            type="button"
            class="px-3 py-1 text-xs text-white rounded-lg disabled:opacity-50"
            [class.bg-blue-500]="!follower.isFollowing"
            [class.hover:bg-blue-600]="!follower.isFollowing"
            [class.bg-red-500]="follower.isFollowing"
            [class.hover:bg-red-600]="follower.isFollowing"
            [disabled]="isLoading(follower._id)"
            (click)="makeFollow(follower._id)"
            >
            @if (isLoading(follower._id)) {
                Loading...
            } @else if (follower.isFollowing) {
                Unfollow
            } @else {
                Follow
            }
            </button>

        </div>
      }

    </div>

    <button
      type="button"
      class="w-full text-sm text-blue-600 font-medium hover:underline"
    >
      View more
    </button>

  </div>
</aside>
